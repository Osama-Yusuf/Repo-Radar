version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - PORT=${PORT:-3001}
      - BACKEND_BASE_URL=http://backend:${PORT:-3001}/api
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      - PORT=${PORT:-3001}
      - POSTGRESQL_HOST=${POSTGRESQL_HOST:-postgres}
      - POSTGRESQL_PORT=${POSTGRESQL_PORT:-5432}
      - POSTGRESQL_DATABASE=${POSTGRESQL_DATABASE:-repo_radar}
      - POSTGRESQL_USER=${POSTGRESQL_USER:-repo_radar_user}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: quay.io/sclorg/postgresql-15-c9s
    ports:
      - "5432:5432"
    environment:
      - POSTGRESQL_USER=repo_radar_user
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRESQL_DATABASE=repo_radar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_radar_user"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
